[project]
name = "dispatchdesk"
version = "0.1.0"
description = "Dispatch copilot for dark store managers"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "gradio>=6.29.0",
    "pgvector>=0.4,<0.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "pyyaml>=6,<7",
    "sqlalchemy==2.1.1",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "requests>=2.34.2",
    "structlog>=25,<27",
    "torch>=2.14,<3",
    "torchvision>=0.29,<1",
    "docling>=2.133.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

# Docling's layout model runs on CPU. Install CPU-only torch on Linux (CI,
# Railway) instead of the default CUDA build and its NVIDIA packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff.lint]
extend-select = []

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]
