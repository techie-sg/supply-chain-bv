[project]
name = "dispatchdesk"
version = "0.1.0"
description = "Dispatch copilot for dark store managers"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "flask",
    "pgvector>=0.4,<0.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "pyyaml>=6,<7",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]
